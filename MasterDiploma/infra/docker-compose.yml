# Инфра: Apache Kafka (KRaft, single-broker, без ZooKeeper) + опц. Prometheus/Grafana.
# Поднять:   make infra-up   (или: docker compose -f infra/docker-compose.yml up -d)
# Топики:    make topics-create
# Остановить: make infra-down
# Для НИР-2 (пилот) этого достаточно; целевая конфигурация (кластер брокеров и т.д.) — см. вольт.

name: uavdet-infra

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: uavdet-kafka
    ports:
      - "9092:9092"          # PLAINTEXT для клиентов снаружи docker-сети (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [uavdet]

  # --- PostgreSQL: хранилище результатов (inference + decisions) ---
  postgres:
    image: postgres:16-alpine
    container_name: uavdet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: uavdet
      POSTGRES_USER: uavdet
      POSTGRES_PASSWORD: uavdet
    volumes:
      - uavdet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uavdet -d uavdet"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [uavdet]

  # Liquibase: применяет миграции схемы uavdet и завершается (one-shot).
  # Запуск:  docker compose -f infra/docker-compose.yml run --rm liquibase update
  #          (или: make db-migrate)
  liquibase:
    image: liquibase/liquibase:4.29
    container_name: uavdet-liquibase
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgres/changelog:/liquibase/changelog:ro
    working_dir: /liquibase/changelog
    command: ["--defaults-file=/liquibase/changelog/liquibase.properties", "update"]
    networks: [uavdet]

  # --- наблюдаемость (опционально; можно не запускать) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: uavdet-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [uavdet]

  grafana:
    image: grafana/grafana:11.0.0
    container_name: uavdet-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [uavdet]

volumes:
  uavdet-pgdata:
    name: uavdet-pgdata

networks:
  uavdet:
    name: uavdet-net
