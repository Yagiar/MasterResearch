[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uavdet-sink"
version = "0.1.0"
description = "Sink/metrics: потребляет decisions -> лог + jsonl + Prometheus /metrics"
requires-python = ">=3.10"
dependencies = [
    "uavdet-common",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
uavdet-sink = "sink.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
